name: Continuous Integration

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'chore/**' ]
    paths-ignore:
      - '**.md'
      - 'man/**'
  pull_request:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'man/**'

permissions:
  contents: read

jobs:
  lints:
    name: Formatting and Clippy Lints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Mirrors release.yml's native-runner targets so cfg(unix)/cfg(windows)
        # and architecture-specific issues (e.g. libutempter multiarch paths)
        # are caught here, not only when a release tag is pushed.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install libutempter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libutempter0

      - name: Verify Formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install libutempter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libutempter0

      - name: Run Tests
        run: cargo test --all-targets --all-features

  # release.yml also cross-compiles windows-aarch64 from windows-latest, but no
  # ARM64 Windows runner exists to actually run tests on it — so this only
  # verifies the build (and thus link) succeeds, mirroring release.yml exactly,
  # rather than tests passing.
  cross-build-check:
    name: Build check (windows-aarch64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Build etr client for windows-aarch64
        run: cargo build --release --target aarch64-pc-windows-msvc --bin etr

  audit:
    name: Security Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Run Cargo Audit
        uses: actions-rust-lang/audit@v1
