name: Continuous Integration

on:
  push:
    branches: [ main, 'feature/**', 'fix/**', 'chore/**' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Offline Guards
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Run standard, man, packaging, text, and wip self-tests and guards
        run: |
          python3 scripts/install_completions.py --self-test
          python3 scripts/install_man.py --self-test
          python3 scripts/gate_conformance.py --self-test
          python3 scripts/gate_conformance.py Justfile
          python3 scripts/man_pages.py --self-test
          python3 scripts/render_packaging.py --self-test
          python3 scripts/packaging_check.py --self-test
          python3 scripts/packaging_check.py
          python3 scripts/text_check.py --self-test
          python3 scripts/text_check.py
          python3 scripts/reset_wip.py --self-test

  lints:
    name: Formatting and Clippy Lints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Mirrors release.yml's native-runner targets so cfg(unix)/cfg(windows)
        # and architecture-specific issues (e.g. libutempter multiarch paths)
        # are caught here, not only when a release tag is pushed.
        os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install libutempter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libutempter0

      - name: Verify Formatting
        run: |
          cargo fmt --check
          cargo fmt --manifest-path tools/stress/Cargo.toml --check

      - name: Run Clippy
        run: |
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo clippy --manifest-path tools/stress/Cargo.toml --all-targets -- -D warnings

  test:
    name: Test Suite (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Install libutempter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libutempter0

      - name: Run Tests
        run: |
          cargo test --locked --all-targets --all-features
          cargo test --manifest-path tools/stress/Cargo.toml

  # release.yml also cross-compiles windows-aarch64 from windows-latest, but no
  # ARM64 Windows runner exists to actually run tests on it — so this only
  # verifies the build (and thus link) succeeds, mirroring release.yml exactly,
  # rather than tests passing.
  cross-build-check:
    name: Build check (windows-aarch64)
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: aarch64-pc-windows-msvc

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Build etr client for windows-aarch64
        run: cargo build --release --locked --target aarch64-pc-windows-msvc --bin etr
