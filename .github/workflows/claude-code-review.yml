name: Claude Code Review

# MANUAL ONLY. This does not run on pull requests automatically.
#
# WHY. The token behind this action has failed before in a way that is worse than useless:
# in rusticprofile it went from 19 consecutive green runs to failing every run in ~490 ms on
# turn 1 at $0.00, posting no findings. A rejection before any tokens are billed is a
# credential or quota problem, not a verdict on the code -- but left on `pull_request` it
# becomes a red check on every future PR for a reason unrelated to that PR, which trains
# everyone to merge over failing checks. That is worse than having no automated review, and
# this repo has already spent effort on the opposite failure: a review job going GREEN
# without reviewing anything.
#
# Run it deliberately instead:
#     gh workflow run claude-code-review.yml -f pr=<number>
#
# To restore automatic review, put the `pull_request:` trigger back — the block below is
# kept intact and commented for exactly that. Check the token first: `gh secret list`
# shows when CLAUDE_CODE_OAUTH_TOKEN was last set, and `claude setup-token` mints a new
# one. Note `claude.yml` uses the same secret, so @claude mentions fail the same way.
#
# Read-only by design: this job reviews, it does not push. Anything that needs to change
# the repository goes through `claude.yml`, which is triggered deliberately by an @claude
# mention and has the write permissions to match.
#
# A GREEN CHECK HERE DOES NOT PROVE A REVIEW HAPPENED. The action requires this file to be
# byte-identical to the copy on the default branch and skips with a `success` conclusion
# when it is not — so any pull request editing this file gets no review, silently. That is
# a security control (it stops a PR rewriting the workflow and running it with the
# repository's secret), not a fault. When changing this file, read the job log for
# `Workflow validation failed` rather than trusting the check mark.

on:
  workflow_dispatch:
    inputs:
      pr:
        description: 'Pull request number to review'
        required: true
        type: string

  # Restore automatic review by uncommenting this and deleting the block above.
  # pull_request:
  #   types: [opened, synchronize, ready_for_review, reopened]

permissions:
  contents: read

jobs:
  claude-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: '/code-review:code-review ${{ github.repository }}/pull/${{ inputs.pr }}'
          # Dependabot opens PRs as a bot actor, and the action refuses non-human actors
          # unless they are named. Without this, exactly the PRs least likely to get a
          # human read would also get no review. Scoped to dependabot alone.
          allowed_bots: 'dependabot[bot]'
          # One comment per PR, updated in place, rather than a new one each push.
          use_sticky_comment: true

      # Make the outcome visible without giving this job write access to the PR.
      #
      # The action posts only when it has findings, and it also skips silently — with a
      # `success` conclusion — when workflow validation fails. So a green check plus no
      # comment has two very different meanings and no way to tell them apart. This writes
      # which one happened into the run summary, where it is one click from the check mark.
      - name: Report whether the review actually ran
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude-review.outputs.execution_file }}
        run: |
          set -uo pipefail
          {
            echo "### Claude Code Review"
            echo
            if [ -z "${EXECUTION_FILE:-}" ] || [ ! -f "${EXECUTION_FILE:-}" ]; then
              echo "**The review did NOT run.** No execution output was produced."
              echo
              echo "The usual cause is the action's workflow-validation check, which skips"
              echo "with a \`success\` conclusion when this workflow file differs from the"
              echo "copy on the default branch — so any PR editing it gets no review."
              echo "Search the job log for \`Workflow validation failed\` to confirm."
            else
              python3 - "$EXECUTION_FILE" <<'PYEOF'
          import json, sys

          # The execution output has changed shape before and may again, so pull the fields
          # out defensively rather than assuming a layout. Reporting "ran, shape
          # unrecognised" is honest; asserting a turn count that is not there is not.
          try:
              data = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f"**The review ran**, but its output could not be parsed ({e}).")
              raise SystemExit(0)

          candidates = data if isinstance(data, list) else [data]
          result = next(
              (c for c in reversed(candidates)
               if isinstance(c, dict) and "num_turns" in c),
              None,
          )

          if result is None:
              print("**The review ran**, but produced no recognisable result record.")
              raise SystemExit(0)

          turns = result.get("num_turns", "?")
          cost = result.get("total_cost_usd")
          errored = result.get("is_error", False)

          status = "completed with an error" if errored else "completed"
          cost_text = f", ${cost:.2f}" if isinstance(cost, (int, float)) else ""
          print(f"**The review ran** and {status} — {turns} turns{cost_text}.")
          print()
          print("Findings, if any, appear as comments on the pull request.")
          print("No comment means the review found nothing to raise.")
          PYEOF
            fi
          # `tee`, not `>>`: the summary is only visible in the Actions UI, so writing
          # solely there means the one thing that reports whether a review happened cannot
          # itself be checked from the logs or the API. Sending it to both makes it
          # verifiable without a browser.
          } | tee -a "$GITHUB_STEP_SUMMARY"

