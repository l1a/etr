name: Claude Code

# Responds to an @claude mention on an issue, a PR comment or a review.
#
# The action only runs for users with **write access** to this repository, which it
# enforces itself — see https://github.com/anthropics/claude-code-action/blob/main/docs/security.md
# That matters here because this repository is public: without it, anyone could trigger a
# run by commenting.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest

    # These apply to the per-run GITHUB_TOKEN, not to any personal access token.
    permissions:
      contents: write        # push branches
      pull-requests: write   # gh pr create / edit
      issues: read
      id-token: write
      actions: read          # read CI results on a PR

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - name: Install build dependencies
        # `just` drives every gate in this repo; `libutempter0` is linked on Linux;
        # `mandown` is needed for `just man` on a version bump.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends just libutempter0
          cargo install mandown

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@c0949c50a78c1ec8ce2647db36629b870e715d0c # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          additional_permissions: |
            actions: read

          claude_args: >-
            --allowedTools
            "Bash(cargo fmt *)"
            "Bash(cargo clippy *)"
            "Bash(cargo test *)"
            "Bash(cargo check *)"
            "Bash(cargo build *)"
            "Bash(cargo run *)"
            "Bash(just check)"
            "Bash(just test)"
            "Bash(just man)"
            "Bash(git add *)"
            "Bash(git commit *)"
            "Bash(git diff *)"
            "Bash(git log *)"
            "Bash(git status)"
            "Bash(git show *)"
            "Bash(gh pr create *)"
            "Bash(gh pr edit *)"
            "Bash(gh pr view *)"

