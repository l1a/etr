name: Release and Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # etrs (the server) is Unix-only by design (fork/setsid daemonization),
          # so Unix builds ship both binaries; Windows builds ship the etr client only.
          - os: ubuntu-latest
            artifact: release-linux-x86_64
            suffix: linux-x86_64
            bins: both
          - os: ubuntu-24.04-arm
            artifact: release-linux-aarch64
            suffix: linux-aarch64
            bins: both
          - os: macos-latest
            artifact: release-macos
            suffix: macos-aarch64
            bins: both
          - os: windows-latest
            artifact: release-windows-x86_64
            suffix: windows-x86_64
            bins: client
          - os: windows-latest
            artifact: release-windows-aarch64
            suffix: windows-aarch64
            bins: client
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install libutempter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libutempter0

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.bins }}" = "client" ]; then
            BINS="--bin etr"
          else
            BINS=""
          fi
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }} $BINS
          else
            cargo build --release $BINS
          fi

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            OUT="target/${{ matrix.target }}/release"
          else
            OUT="target/release"
          fi
          EXT=""
          [[ "${{ matrix.os }}" == windows-* ]] && EXT=".exe"
          cp "$OUT/etr$EXT" "dist/etr-${{ matrix.suffix }}$EXT"
          if [ "${{ matrix.bins }}" != "client" ]; then
            cp "$OUT/etrs$EXT" "dist/etrs-${{ matrix.suffix }}$EXT"
          fi

      - name: Add desktop entry and icon (linux-x86_64 only)
        if: matrix.suffix == 'linux-x86_64'
        run: |
          cp assets/linux/etr.desktop dist/etr.desktop
          cp assets/logos/etr-logo-256.png dist/etr-icon-256.png

      # Completions are generated by the binaries just built, so they cannot disagree with
      # the CLI they describe -- the same reasoning the COPR spec and the Homebrew formula
      # already record. They go somewhere OTHER than dist/ deliberately: everything in dist/
      # becomes an individual release asset, and eight loose completion files on the release
      # page is not the goal. The `extras` job packs them into one tarball instead.
      #
      # The layout uses the FINAL installed names (`_etr` for zsh, `etr.fish` for fish) so the
      # AUR PKGBUILD's package() is a straight copy and the naming convention lives in one
      # place rather than two.
      - name: Generate shell completions (Linux only)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p completions/bash completions/zsh completions/fish
          for b in etr etrs; do
            "target/release/$b" --completions bash > "completions/bash/$b"
            "target/release/$b" --completions zsh  > "completions/zsh/_$b"
            "target/release/$b" --completions fish > "completions/fish/$b.fish"
          done

      - name: Upload completions (Linux only)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: completions-${{ matrix.suffix }}
          path: completions/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  # One arch-independent tarball carrying the two man pages and bash/zsh/fish completions for
  # both binaries.
  #
  # It exists because `etr-terminal-bin` is a `-bin` package: it has no source tree to take man
  # pages from, and the obvious way to get completions -- running the downloaded binary in
  # package() -- breaks whenever the build host's architecture differs from the target's, which
  # is exactly the aarch64 case. Shipping them as a release asset instead means the PKGBUILD
  # installs files and executes nothing, so it is correct under `makepkg -A`, a foreign-arch
  # chroot and any cross-build.
  #
  # Completions are architecture-independent: clap derives them from the CLI definition, and no
  # `cfg` attribute appears inside either binary's `Cli` struct. That is ASSERTED below rather
  # than trusted -- both Linux runners generate a set natively and this job fails if they
  # differ by a byte.
  extras:
    name: Pack man pages and completions
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Download completions from both Linux architectures
        uses: actions/download-artifact@v8
        with:
          pattern: completions-linux-*
          path: completions-by-arch

      - name: Prove both architectures generate identical completions
        run: |
          set -euo pipefail
          X=completions-by-arch/completions-linux-x86_64
          A=completions-by-arch/completions-linux-aarch64
          for d in "$X" "$A"; do
            [ -d "$d" ] || { echo "::error::$d is missing -- did that build upload its completions?"; exit 1; }
          done
          # A hard failure, not a warning. If these ever diverge, the single copy shipped to the
          # AUR is wrong for one architecture, and shipping it regardless is precisely the
          # silent-wrong-answer outcome this project refuses everywhere else.
          diff -r "$X" "$A" || {
            echo "::error::completions differ between linux-x86_64 and linux-aarch64, so one"
            echo "::error::arch-independent copy can no longer be shipped. See packaging/aur/PKGBUILD.in."
            exit 1
          }
          echo "x86_64 and aarch64 completions are byte-identical:"
          find "$X" -type f | sort | sed "s|^$X/|  |"

      - name: Pack etr-extras.tar.gz
        run: |
          set -euo pipefail
          # THE LAYOUT IS A CONTRACT with packaging/aur/PKGBUILD.in's package(), which copies
          # these paths verbatim out of $srcdir. Every name here is the final installed name:
          #
          #   man/etr.1      completions/bash/etr    completions/zsh/_etr   completions/fish/etr.fish
          #   man/etrs.1     completions/bash/etrs   completions/zsh/_etrs  completions/fish/etrs.fish
          #
          # The man pages are the COMMITTED ones, installed as-is and never regenerated with
          # mandown -- the same reasoning the COPR spec and the Homebrew formula already carry:
          # regenerating would make the packaged page depend on which mandown build happened to
          # run. They are tracked precisely so this checkout carries them.
          mkdir -p extras/man
          cp man/etr.1 man/etrs.1 extras/man/
          cp -r completions-by-arch/completions-linux-x86_64 extras/completions
          mkdir -p dist
          tar -czf dist/etr-extras.tar.gz -C extras man completions
          tar -tzf dist/etr-extras.tar.gz | sort

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-extras
          path: dist/*

  release:
    name: Create GitHub Release
    needs: [build, extras]
    runs-on: ubuntu-latest
    steps:
      # `pattern` is load-bearing, not tidiness. Every artifact meant to become a release
      # asset is named `release-*`; the `completions-linux-*` artifacts are raw INPUT to the
      # `extras` job and must not be published. Without the pattern, merge-multiple would fold
      # them into dist/ and `files: dist/**/*` would attach six loose completion files to the
      # release -- which is the whole reason they are uploaded separately in the first place.
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prune:
    name: Prune old releases
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases beyond 20 most recent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[20:][].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
