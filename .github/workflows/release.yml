name: Release and Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.suffix }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # etrs (the server) is Unix-only by design (fork/setsid daemonization),
          # so Unix builds ship both binaries; Windows builds ship the etr client only.
          - os: ubuntu-latest
            artifact: release-linux-x86_64
            suffix: linux-x86_64
            bins: both
          - os: ubuntu-24.04-arm
            artifact: release-linux-aarch64
            suffix: linux-aarch64
            bins: both
          - os: macos-latest
            artifact: release-macos
            suffix: macos-aarch64
            bins: both
          - os: windows-latest
            artifact: release-windows-x86_64
            suffix: windows-x86_64
            bins: client
          - os: windows-latest
            artifact: release-windows-aarch64
            suffix: windows-aarch64
            bins: client
            target: aarch64-pc-windows-msvc
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2

      - name: Install libutempter (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libutempter0

      - name: Build release binaries
        shell: bash
        run: |
          if [ "${{ matrix.bins }}" = "client" ]; then
            BINS="--bin etr"
          else
            BINS=""
          fi
          if [ -n "${{ matrix.target }}" ]; then
            cargo build --release --target ${{ matrix.target }} $BINS
          else
            cargo build --release $BINS
          fi

      - name: Package release assets
        shell: bash
        run: |
          mkdir -p dist
          if [ -n "${{ matrix.target }}" ]; then
            OUT="target/${{ matrix.target }}/release"
          else
            OUT="target/release"
          fi
          EXT=""
          [[ "${{ matrix.os }}" == windows-* ]] && EXT=".exe"
          cp "$OUT/etr$EXT" "dist/etr-${{ matrix.suffix }}$EXT"
          if [ "${{ matrix.bins }}" != "client" ]; then
            cp "$OUT/etrs$EXT" "dist/etrs-${{ matrix.suffix }}$EXT"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: dist/*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  prune:
    name: Prune old releases
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Delete releases beyond 20 most recent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release list --limit 1000 --json tagName --jq '.[20:][].tagName' \
            | xargs -r -I{} gh release delete {} --yes --cleanup-tag
