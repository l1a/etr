[package]
name = "etr"
version = "0.10.8"
edition = "2024"
description = "Reconnecting remote shell over QUIC — a Rust implementation of Eternal Terminal (et)"
license = "GPL-3.0-only"
repository = "https://github.com/l1a/etr"
readme = "README.md"
keywords = ["terminal", "ssh", "remote-shell", "mosh", "reconnect"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    ".clauderc",
    "AGENTS.md",
    "CLAUDE.md",
    "NOTES.md",
    "justfile",
    "scripts/",
    "packaging/",
    ".github/",
    # Packaging machinery for COPR: only ever run by COPR's mock buildroot.
    ".copr/",
]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.6"
portable-pty = "0.9"
prost = "0.14"
# MINIMUM 0.11.12 IS A CORRECTNESS REQUIREMENT, NOT A PREFERENCE.
#
# quinn 0.11.12 is the first release requiring quinn-proto >= 0.11.18, which carries
# quinn-rs/quinn#2814. Without it, `Assembler::defragment` keeps contiguous chunks separate and
# the retained-chunk count scales with `stream_receive_window` -- so a forwarding relay stalled
# by ordinary TCP back-pressure tears down the WHOLE connection, interactive shell included
# (etr v0.9.3 shipped a reduced window as a stopgap for exactly this).
#
# Expressing the floor here is the guard. cargo then cannot resolve a vulnerable pair at all,
# which is stronger than any test: a test has to be reached and has to reproduce, and a
# behavioural one written for this did NOT reproduce in-process -- see src/quic.rs.
quinn = "0.11.12"
rcgen = "0.14"
rustls = "0.23"
rand = "0.9"
crossterm = "0.29"
nix = { version = "0.31", features = ["fs", "term", "process", "signal"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Windows-only: put the console into virtual-terminal mode so the client speaks
# the same key/ANSI byte conventions a Unix PTY expects (Backspace → DEL, etc.),
# and read the console input handle directly with `ReadFile`
# (Win32_Storage_FileSystem) to get an unbatched, per-keystroke VT byte stream.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[[bench]]
name = "session_bench"
harness = false

# Build profile for profiling: optimised like release but with full debug symbols
# so samply / cargo-flamegraph produce useful annotated stacks.
[profile.profiling]
inherits = "release"
debug = true
