[package]
name = "etr"
version = "0.7.2"
edition = "2024"
description = "A Rust implementation of Eternal Terminal (et)"
license = "GPL-3.0-only"
repository = "https://github.com/l1a/etr"
readme = "README.md"
keywords = ["terminal", "ssh", "remote-shell", "mosh", "reconnect"]
categories = ["command-line-utilities", "network-programming"]
exclude = [
    ".clauderc",
    "AGENTS.md",
    "CLAUDE.md",
    "NOTES.md",
    "justfile",
    "scripts/",
    "packaging/",
    ".github/",
]

[dependencies]
tokio = { version = "1.38", features = ["full"] }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
clap_complete_nushell = "4.6"
portable-pty = "0.9"
prost = "0.14"
quinn = "0.11"
rcgen = "0.14"
rustls = "0.23"
rand = "0.9"
crossterm = "0.29"
nix = { version = "0.31", features = ["fs", "term", "process", "signal"] }
dirs = "6"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
toml = "1"

# Windows-only: put the console into virtual-terminal mode so the client speaks
# the same key/ANSI byte conventions a Unix PTY expects (Backspace → DEL, etc.),
# and read the console input handle directly with `ReadFile`
# (Win32_Storage_FileSystem) to get an unbatched, per-keystroke VT byte stream.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_Storage_FileSystem",
] }

[dev-dependencies]
criterion = { version = "0.8", features = ["async_tokio"] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3"

[[bench]]
name = "session_bench"
harness = false

# Build profile for profiling: optimised like release but with full debug symbols
# so samply / cargo-flamegraph produce useful annotated stacks.
[profile.profiling]
inherits = "release"
debug = true
